            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');

            // Простой хэш пароля (не настоящий, но для демо сойдёт)
            const hashPassword = (str) => {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash |= 0;
                }
                return 'hash_' + Math.abs(hash);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (!username.trim() || !password.trim()) {
                    setError('Заполни все поля');
                    return;
                }

                if (username.length < 3) {
                    setError('Логин должен быть минимум 3 символа');
                    return;
                }

                if (password.length < 4) {
                    setError('Пароль должен быть минимум 4 символа');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('megaseed_users') || '{}');

                if (isRegister) {
                    // РЕГИСТРАЦИЯ
                    if (password !== confirmPassword) {
                        setError('Пароли не совпадают');
                        return;
                    }
                    if (users[username]) {
                        setError('Такой пользователь уже существует');
                        return;
                    }
                    users[username] = {
                        password: hashPassword(password),
                        created: new Date().toISOString()
                    };
                    localStorage.setItem('megaseed_users', JSON.stringify(users));
                    setSuccess('Регистрация успешна! Теперь войди');
                    setIsRegister(false);
                    setPassword('');
                    setConfirmPassword('');
                } else {
                    // ВХОД
                    if (!users[username]) {
                        setError('Пользователь не найден. Зарегистрируйся');
                        return;
                    }
                    if (users[username].password !== hashPassword(password)) {
                        setError('Неверный пароль');
                        return;
                    }
                    // Сохраняем текущую сессию
                    localStorage.setItem('megaseed_current_user', username);
                    onLogin(username);
                }
            };

                        </div>

                                <button
                                    onClick={() => { setIsRegister(false); setError(''); setSuccess(''); }}
                                    className={`flex-1 py-2 rounded-lg font-semibold transition ${!isRegister ? 'bg-emerald-500 text-white' : 'bg-gray-800 text-gray-400'}`}
                                >
                                    Вход

                                <button
                                    onClick={() => { setIsRegister(true); setError(''); setSuccess(''); }}
                                    className={`flex-1 py-2 rounded-lg font-semibold transition ${isRegister ? 'bg-emerald-500 text-white' : 'bg-gray-800 text-gray-400'}`}
                                >
                                    Регистрация
                                </button>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">

                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="Введи логин"
                                        className="auth-input w-full px-4 py-3 rounded-lg text-white"
                                        autoComplete="username"
                                    />
                                </div>
                                <div>
                                    <label className="text-sm text-gray-400 mb-1 block">Пароль</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="Введи пароль"
                                        className="auth-input w-full px-4 py-3 rounded-lg text-white"
                                        autoComplete={isRegister ? "new-password" : "current-password"}

                                </div>

                                        <label className="text-sm text-gray-400 mb-1 block">Повтори пароль</label>
                                        <input
                                            type="password"
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function seededRandom(seed, index) {
            const x = Math.sin(seed + index * 9999) * 10000;
            return x - Math.floor(x);
        }

        function generateStructuresForSeed(seedValue, dimension, radius, selectedTypes) {
            const seed = hashCode(String(seedValue));
            const structures = [];
            const typesToCheck = Object.keys(STRUCTURES).filter(t => selectedTypes.includes(t) && STRUCTURES[t].dimension === dimension);
            typesToCheck.forEach((type, idx) => {
                for (let attempt = 0; attempt < 2; attempt++) {
                    const rand = seededRandom(seed, idx * 100 + attempt);
                    if (rand < 0.7) {
                        const angle = seededRandom(seed, idx * 200 + attempt) * Math.PI * 2;
                        const distance = 100 + seededRandom(seed, idx * 300 + attempt) * (radius - 100);
                        const x = Math.round(Math.cos(angle) * distance);
                        const z = Math.round(Math.sin(angle) * distance);
                        structures.push({ type, x, z, distance: Math.round(Math.sqrt(x * x + z * z)) });
                        break;
                    }
                }
            });
            return structures.sort((a, b) => a.distance - b.distance);
        }

            const [searchResults, setSearchResults] = useState([]);

            const [selectedCategory, setSelectedCategory] = useState('all');

            // Проверяем авторизацию при загрузке
            useEffect(() => {
                const savedUser = localStorage.getItem('megaseed_current_user');
                if (savedUser) setCurrentUser(savedUser);
            }, []);

            const handleLogin = (username) => setCurrentUser(username);
            const handleLogout = () => {
                localStorage.removeItem('megaseed_current_user');
                setCurrentUser(null);
            };

            // Если не авторизован — показываем экран входа

                return <AuthScreen onLogin={handleLogin} />;
            }

            const toggleStructure = (type) => setSelectedStructures(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
            const toggleBiome = (biome) => setSelectedBiomes(prev => prev.includes(biome) ? prev.filter(b => b !== biome) : [...prev, biome]);

            const handleSearch = () => {
                setIsSearching(true);
                setTimeout(() => {
                    const seeds = version === 'java' ? JAVA_SEEDS : BEDROCK_SEEDS;
                    const results = seeds.map(seedValue => {
                        const structures = generateStructuresForSeed(seedValue, dimension, radius, selectedStructures);
                        return { seed_value: seedValue, version, dimension, structures_found: structures.length, structures };
                    }).filter(r => r.structures_found > 0);
                    setSearchResults(results);
                    setIsSearching(false);
                }, 1200);
            };

            const handleAnalyze = () => {
                if (!customSeed.trim()) { alert('Введи сид!'); return; }
                const structures = generateStructuresForSeed(customSeed, dimension, radius, selectedStructures);
                setAnalysisResult({ seed_value: customSeed, dimension, structures_found: structures.length, structures });
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert('✅ Скопировано: ' + text);
            };

            const filteredMods = useMemo(() => MODS_DATA.filter(mod => {
                const matchesGenre = selectedGenre === 'all' || mod.genre === selectedGenre;
                const matchesSearch = mod.name.toLowerCase().includes(modFilter.toLowerCase());
                return matchesGenre && matchesSearch;
            }), [modFilter, selectedGenre]);

            const filteredTextures = useMemo(() => TEXTURE_PACKS.filter(pack => {
                const matchesStyle = selectedStyle === 'all' || pack.style === selectedStyle;
                const matchesSearch = pack.name.toLowerCase().includes(textureFilter.toLowerCase());
                return matchesStyle && matchesSearch;
            }), [textureFilter, selectedStyle]);

            const biomeCategories = useMemo(() => ['all', ...new Set(Object.values(BIOMES).map(b => b.category))], []);
            const filteredBiomes = useMemo(() => selectedCategory === 'all' ? Object.entries(BIOMES) : Object.entries(BIOMES).filter(([_, b]) => b.category === selectedCategory), [selectedCategory]);
            const textureStyles = useMemo(() => ['all', ...new Set(TEXTURE_PACKS.map(p => p.style))], []);

            return (
                <div className="min-h-screen relative z-10">
                    {/* Шапка с пользователем */}
                    <div className="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl md:text-4xl font-bold gradient-text">MegaSeed Finder</h1>
                            <p className="text-gray-400 text-sm">133 Мода • 50 Текстур • 60 Биомов</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="text-right">
                                <div className="text-xs text-gray-500">Вошёл как</div>
                                <div className="font-semibold text-emerald-400">👤 {currentUser}</div>
                            </div>
                            <button onClick={handleLogout} className="px-3 py-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 transition text-sm">
                                Выйти
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 mb-8">
                        <div className="flex flex-col sm:flex-row gap-3">
                            <button onClick={() => {setActiveTab('search'); setSelectedMod(null); setSelectedTexture(null);}} className={`flex-1 p-4 rounded-xl border-2 transition-all ${activeTab === 'search' ? 'tab-active' : 'border-gray-800 bg-gray-900/50'}`}>
                                <div className="text-2xl mb-1"></div><div className="font-bold">Поиск сидов</div>
                            </button>
                            <button onClick={() => {setActiveTab('analyze'); setSelectedMod(null); setSelectedTexture(null);}} className={`flex-1 p-4 rounded-xl border-2 transition-all ${activeTab === 'analyze' ? 'tab-active' : 'border-gray-800 bg-gray-900/50'}`}>
                                <div className="text-2xl mb-1"></div><div className="font-bold">Анализ сида</div>
                            </button>
                            <button onClick={() => {setActiveTab('mods'); setSelectedTexture(null);}} className={`flex-1 p-4 rounded-xl border-2 transition-all ${activeTab === 'mods' ? 'tab-active' : 'border-gray-800 bg-gray-900/50'}`}>
                                <div className="text-2xl mb-1">📦</div><div className="font-bold">Моды</div>
                            </button>
                            <button onClick={() => {setActiveTab('textures'); setSelectedMod(null);}} className={`flex-1 p-4 rounded-xl border-2 transition-all ${activeTab === 'textures' ? 'tab-active' : 'border-gray-800 bg-gray-900/50'}`}>
                                <div className="text-2xl mb-1">🎨</div><div className="font-bold">Текстуры</div>
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 pb-16">
                        {activeTab === 'search' && (
                            <div>
                                <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-6 mb-6">
                                    <h3 className="text-lg font-bold mb-4">⚙️ Настройки поиска</h3>
                                    <div className="mb-5">
                                        <label className="text-sm text-gray-400 mb-2 block">🌍 Измерение:</label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setDimension('overworld')} className={`flex-1 p-3 rounded-lg border-2 transition ${dimension === 'overworld' ? 'border-emerald-500 bg-emerald-500/20' : 'border-gray-700'}`}>🌳 Верхний мир</button>
                                            <button onClick={() => setDimension('nether')} className={`flex-1 p-3 rounded-lg border-2 transition ${dimension === 'nether' ? 'border-red-500 bg-red-500/20' : 'border-gray-700'}`}>🔥 Незер</button>
                                        </div>
                                    </div>
                                    <div className="mb-5">
                                        <label className="text-sm text-gray-400 mb-2 block">🎮 Версия:</label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setVersion('java')} className={`flex-1 p-3 rounded-lg border-2 transition ${version === 'java' ? 'border-emerald-500 bg-emerald-500/20' : 'border-gray-700'}`}>☕ Java</button>
                                            <button onClick={() => setVersion('bedrock')} className={`flex-1 p-3 rounded-lg border-2 transition ${version === 'bedrock' ? 'border-cyan-500 bg-cyan-500/20' : 'border-gray-700'}`}>🪨 Bedrock</button>
                                        </div>
                                    </div>
                                    <div className="mb-5">
                                        <label className="text-sm text-gray-400 mb-2">📏 Радиус: {radius} блоков</label>
                                        <input type="range" min="100" max="3000" step="100" value={radius} onChange={(e) => setRadius(Number(e.target.value))} className="w-full"/>
                                    </div>
                                    <div className="mb-5">
                                        <label className="text-sm text-gray-400 mb-2 block">🗂️ Категория биомов:</label>
                                        <div className="flex flex-wrap gap-2">
                                            {biomeCategories.map(cat => (
                                                <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1.5 rounded-lg text-sm ${selectedCategory === cat ? 'bg-emerald-500 text-white' : 'bg-gray-800 text-gray-300'}`}>
                                                    {cat === 'all' ? '🎯 Все' : cat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="mb-5">
                                        <label className="text-sm text-gray-400 mb-2 block"> Биомы ({selectedBiomes.length} выбрано):</label>
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-80 overflow-y-auto">
                                            {filteredBiomes.map(([key, biome]) => {
                                                const isSelected = selectedBiomes.includes(key);
                                                return (
                                                    <button key={key} onClick={() => toggleBiome(key)} className={`biome-tag flex items-center gap-2 p-3 rounded-lg border-2 transition text-left ${isSelected ? 'biome-selected text-white' : 'border-gray-700 bg-gray-800/50 hover:border-gray-600'}`}>
                                                        <span className="text-2xl">{biome.icon}</span>
                                                        <div className="font-semibold text-sm">{biome.name}</div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {selectedBiomes.length > 0 && <button onClick={() => setSelectedBiomes([])} className="mt-3 text-xs text-red-400 hover:underline">Сбросить все биомы</button>}
                                    </div>
                                    <div>
                                        <label className="text-sm text-gray-400 mb-2 block">️ Структуры:</label>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                            {Object.entries(STRUCTURES).filter(([_, s]) => s.dimension === dimension).map(([key, info]) => {
                                                const isSelected = selectedStructures.includes(key);
                                                return (
                                                    <button key={key} onClick={() => toggleStructure(key)} className={`flex items-center gap-2 p-3 rounded-lg border-2 transition text-left ${isSelected ? 'bg-emerald-500/20 border-emerald-500' : 'border-gray-700 bg-gray-800/50 hover:border-gray-600'}`}>
                                                        <span className="text-2xl">{info.icon}</span>
                                                        <div className="font-semibold text-sm">{info.name}</div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                                <button onClick={handleSearch} disabled={isSearching} className="w-full p-4 rounded-xl font-bold text-lg mb-6 bg-gradient-to-r from-emerald-600 to-cyan-600 hover:opacity-90 transition">
                                    {isSearching ? '⚙️ Поиск...' : ' Найти сиды'}
                                </button>
                                {searchResults.map((seed, i) => (
                                    <div key={i} className="border border-gray-700 bg-gray-900/80 rounded-xl p-5 mb-4">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-2xl font-mono font-bold text-emerald-400">{seed.seed_value}</span>
                                            <button onClick={() => copyToClipboard(seed.seed_value)} className="px-3 py-1 rounded bg-emerald-600/30 text-emerald-400 text-sm">📋 Копировать</button>
                                        </div>
                                        <p className="text-sm text-gray-400 mb-3">{seed.structures_found} структур найдено</p>
                                        <div className="space-y-2">
                                            {seed.structures.map((s, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-white/5 p-2 rounded">
                                                    <span>{STRUCTURES[s.type]?.icon} {STRUCTURES[s.type]?.name}</span>
                                                    <span className="text-sm text-gray-400">{s.distance} м (X:{s.x}, Z:{s.z})</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'analyze' && (
                            <div>
                                <div className="bg-gray-900/50 border border-gray-800 rounded-xl p-6 mb-6">
                                    <label className="text-sm text-gray-400 mb-2 block">⌨️ Введи сид:</label>
                                    <input type="text" value={customSeed} onChange={(e) => setCustomSeed(e.target.value)} placeholder="Например: 12345" className="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-emerald-500 outline-none font-mono text-lg"/>
                                </div>
                                <button onClick={handleAnalyze} className="w-full p-4 rounded-xl font-bold text-lg mb-6 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:opacity-90 transition">🎯 Анализировать</button>
                                {analysisResult && (
                                    <div className="border border-gray-700 bg-gray-900/80 rounded-xl p-5">
                                        <h3 className="text-2xl font-mono font-bold text-cyan-400 mb-3">{analysisResult.seed_value}</h3>
                                        <p className="text-gray-400 mb-3">{analysisResult.structures_found} структур</p>
                                        <div className="space-y-2">
                                            {analysisResult.structures.map((s, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-white/5 p-2 rounded">
                                                    <span>{STRUCTURES[s.type]?.icon} {STRUCTURES[s.type]?.name}</span>
                                                    <span className="text-sm text-gray-400">{s.distance} м (X:{s.x}, Z:{s.z})</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'mods' && !selectedMod && (
                            <div>
                                <h2 className="text-3xl font-bold mb-6">📦 Моды ({MODS_DATA.length})</h2>
                                <input type="text" placeholder="🔍 Поиск..." value={modFilter} onChange={(e) => setModFilter(e.target.value)} className="w-full max-w-md p-3 rounded-lg bg-gray-800 border border-gray-700 mb-6"/>
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredMods.map(mod => {
                                        const genre = GENRES[mod.genre];
                                        return (
                                            <div key={mod.id} className="mod-card border border-gray-700 rounded-xl p-5 card-hover cursor-pointer" onClick={() => setSelectedMod(mod)}>
                                                <div className="text-5xl mb-3">{mod.image}</div>
                                                <h3 className="text-xl font-bold mb-2">{mod.name}</h3>
                                                <p className="text-sm text-gray-400 mb-4 line-clamp-2">{mod.description}</p>
                                                <div className="flex items-center justify-between text-xs mb-3">
                                                    <span className="px-2 py-1 rounded-full text-white" style={{background: genre.color + '40', color: genre.color}}>{genre.icon} {genre.name}</span>
                                                    <span className="text-gray-500">⬇️ {mod.downloads}</span>
                                                </div>
                                                <a href={mod.downloadUrl} target="_blank" onClick={(e) => e.stopPropagation()} className="download-btn block w-full py-2 rounded-lg text-white font-semibold text-center">⬇️ Скачать</a>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'mods' && selectedMod && (
                            <div>
                                <button onClick={() => setSelectedMod(null)} className="mb-6 text-gray-400 hover:text-white">← Назад</button>
                                <div className="mod-card border border-gray-700 rounded-xl p-8">
                                    <div className="flex flex-col md:flex-row gap-8">
                                        <div className="text-9xl flex items-center justify-center w-48 h-48 bg-gray-800 rounded-2xl">{selectedMod.image}</div>
                                        <div className="flex-1">
                                            <h2 className="text-4xl font-bold mb-2">{selectedMod.name}</h2>
                                            <p className="text-lg text-gray-300 mb-6">{selectedMod.description}</p>
                                            <div className="space-y-2 text-sm text-gray-400 mb-8">
                                                <p><strong className="text-white">Автор:</strong> {selectedMod.author}</p>
                                                <p><strong className="text-white">Версия:</strong> {selectedMod.version}</p>
                                            </div>
                                            <a href={selectedMod.downloadUrl} target="_blank" className="download-btn inline-block px-8 py-4 rounded-xl text-white font-bold text-lg">️ Скачать мод</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'textures' && !selectedTexture && (
                            <div>
                                <h2 className="text-3xl font-bold mb-6">🎨 Текстуры ({TEXTURE_PACKS.length})</h2>
                                <input type="text" placeholder="🔍 Поиск..." value={textureFilter} onChange={(e) => setTextureFilter(e.target.value)} className="w-full max-w-md p-3 rounded-lg bg-gray-800 border border-gray-700 mb-6"/>
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredTextures.map(pack => (
                                        <div key={pack.id} className="mod-card border border-gray-700 rounded-xl p-5 card-hover cursor-pointer" onClick={() => setSelectedTexture(pack)}>
                                            <div className="text-5xl mb-3">{pack.image}</div>
                                            <h3 className="text-xl font-bold mb-2">{pack.name}</h3>
                                            <p className="text-sm text-gray-400 mb-4 line-clamp-2">{pack.description}</p>
                                            <span className="text-xs px-2 py-1 rounded bg-purple-600/30 text-purple-400">{pack.resolution}</span>
                                            <a href={pack.downloadUrl} target="_blank" onClick={(e) => e.stopPropagation()} className="download-btn block w-full py-2 rounded-lg text-white font-semibold text-center mt-3">⬇️ Скачать</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'textures' && selectedTexture && (
                            <div>
                                <button onClick={() => setSelectedTexture(null)} className="mb-6 text-gray-400 hover:text-white">← Назад</button>
                                <div className="mod-card border border-gray-700 rounded-xl p-8">
                                    <div className="flex flex-col md:flex-row gap-8">
                                        <div className="text-9xl flex items-center justify-center w-48 h-48 bg-gray-800 rounded-2xl">{selectedTexture.image}</div>
                                        <div className="flex-1">
                                            <h2 className="text-4xl font-bold mb-2">{selectedTexture.name}</h2>
                                            <p className="text-lg text-gray-300 mb-8">{selectedTexture.description}</p>
                                            <a href={selectedTexture.downloadUrl} target="_blank" className="download-btn inline-block px-8 py-4 rounded-xl text-white font-bold text-lg">⬇️ Скачать текстурпак</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
                        <p>MegaSeed Finder • Пользователь: {currentUser}</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
